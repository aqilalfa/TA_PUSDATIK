services:
  # Qdrant Vector Database (internal only)
  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: spbe-qdrant-prod
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - spbe-network
    healthcheck:
      # qdrant/qdrant image does not include curl/wget; use bash TCP check.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis for rate limits, token revocation, and security counters (internal only)
  redis:
    image: redis:7-alpine
    container_name: spbe-redis-prod
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    restart: unless-stopped
    networks:
      - spbe-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend FastAPI Service (internal only; accessed through frontend nginx /api proxy)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: spbe-backend-prod
    env_file: .env.docker
    environment:
      DEBUG: "false"
      RELOAD: "false"
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DATABASE_URL: "sqlite:////app/data/spbe_rag.db"
      QDRANT_URL: "http://qdrant:6333"
      REDIS_ENABLED: "true"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models:ro
      - ./logs/backend:/app/logs
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - spbe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Frontend (nginx serving Vue build and proxying /api to backend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Empty means the frontend uses the browser's current origin.
        # This is safest because /api is proxied by nginx.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: spbe-frontend-prod
    ports:
      # Bind to localhost only so a host reverse proxy (Caddy/Nginx) owns public 80/443.
      # Change to "80:80" only for direct LAN testing without a host reverse proxy.
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - spbe-network

networks:
  spbe-network:
    driver: bridge
